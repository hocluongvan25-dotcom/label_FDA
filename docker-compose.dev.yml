# Optional local-development scanner; requires Docker outside the browser sandbox.
services:
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav-definitions:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 30s
      timeout: 10s
      retries: 10
    mem_limit: 2g
volumes:
  clamav-definitions:
