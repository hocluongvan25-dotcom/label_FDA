<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980"><rect width="720" height="980" fill="#f5f0e3"/><rect x="29" y="29" width="662" height="922" rx="4" fill="none" stroke="#b4a879"/><text x="360" y="118" text-anchor="middle" fill="#315c44" font-family="Georgia,serif" font-size="36">AN NHIEN</text><text x="360" y="154" text-anchor="middle" fill="#8a876a" font-family="Arial,sans-serif" font-size="14" letter-spacing="4">LOTUS GREEN TEA</text><path d="M83 200H637" stroke="#b9ad8a"/>
<text x="84" y="257" fill="#315c44" font-family="Arial,sans-serif" font-size="20" font-weight="bold">A Vietnamese tea tradition</text><g fill="#65725b" font-family="Arial,sans-serif" font-size="18"><text x="84" y="296">Delicate green tea, gently scented with lotus.</text><text x="84" y="327">A floral aroma for your everyday moments.</text></g>
<text x="84" y="403" fill="#315c44" font-family="Arial,sans-serif" font-size="21" font-weight="bold">Thành phần:</text><text x="84" y="440" fill="#65725b" font-family="Arial,sans-serif" font-size="20">Trà xanh, hoa sen.</text>
<text x="84" y="514" fill="#315c44" font-family="Arial,sans-serif" font-size="21" font-weight="bold">BREW A LITTLE CALM</text><g fill="#65725b" font-family="Arial,sans-serif" font-size="19"><text x="84" y="555">1. Place one tea bag in your favorite cup.</text><text x="84" y="589">2. Add 200 ml water at 80–85 °C.</text><text x="84" y="623">3. Steep for 3 minutes and enjoy.</text></g>
<path d="M83 672H637" stroke="#b9ad8a"/><g fill="#65725b" font-family="Arial,sans-serif" font-size="18"><text x="84" y="718">Store in a cool, dry place. Keep away from sunlight.</text><text x="84" y="769">Distributed by AN NHIEN</text><text x="84" y="809">Product of Vietnam</text></g>
<g fill="#315c44"><path d="M86 850h3v63h-3zm6 0h2v63h-2zm7 0h5v63h-5zm10 0h2v63h-2zm5 0h6v63h-6zm11 0h3v63h-3zm8 0h6v63h-6zm10 0h2v63h-2zm6 0h7v63h-7zm12 0h2v63h-2zm8 0h5v63h-5zm10 0h2v63h-2zm6 0h4v63h-4zm10 0h7v63h-7zm12 0h2v63h-2zm6 0h6v63h-6zm10 0h3v63h-3zm8 0h7v63h-7zm12 0h2v63h-2zm7 0h5v63h-5zm9 0h2v63h-2zm6 0h7v63h-7zm12 0h3v63h-3zm8 0h6v63h-6"/></g><text x="440" y="895" fill="#8a876a" font-family="Arial,sans-serif" font-size="14">annhientea.example</text></svg>
